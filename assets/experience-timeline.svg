<svg width="1160" height="280" viewBox="0 0 1160 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stormBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04050c"/>
      <stop offset="40%" stop-color="#0b1230"/>
      <stop offset="70%" stop-color="#131a3f"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="lightningGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5599ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#5599ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1160" height="280" rx="16" fill="url(#stormBg)"/>
  <rect x="1" y="1" width="1158" height="278" rx="15" fill="none" stroke="#9fd8ff" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- Ambient Light Effects Behind Cards -->
  <circle cx="580" cy="160" r="300" fill="url(#lightningGlow)"/>

  <!-- Section Title -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="580" y="52" font-size="22" font-weight="700" fill="#eaf6ff" letter-spacing="1">Experience &amp; Initiatives</text>
  </g>

  <!-- Connecting Timeline Lightning Path -->
  <path d="M 60 160 L 290 160 L 310 155 L 330 165 L 570 165 L 590 155 L 610 160 L 850 160 L 870 165 L 890 155 L 1100 160" fill="none" stroke="#5599ff" stroke-width="2" stroke-opacity="0.4" filter="url(#glow)"/>

  <!-- Timeline Cards Group -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    
    <!-- Card 1: Education -->
    <g transform="translate(55, 90)">
      <rect x="0" y="0" width="240" height="135" rx="12" fill="#0d1536" fill-opacity="0.7" stroke="#61dafb" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="120" cy="70" r="6" fill="#61dafb" filter="url(#glow)"/>
      <text x="120" y="34" font-size="15" font-weight="700" fill="#61dafb">ACADEMICS</text>
      <text x="120" y="62" font-size="14" font-weight="700" fill="#ffffff">B.E. Information Technology</text>
      <text x="120" y="102" font-size="13" font-weight="500" fill="#9fb3d9">Engineering Student</text>
    </g>

    <!-- Card 2: Skill Developer Community -->
    <g transform="translate(325, 90)">
      <rect x="0" y="0" width="240" height="135" rx="12" fill="#0d1536" fill-opacity="0.7" stroke="#cfe9ff" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="120" cy="70" r="6" fill="#cfe9ff" filter="url(#glow)"/>
      <text x="120" y="34" font-size="15" font-weight="700" fill="#cfe9ff">STUDENT INITIATIVE</text>
      <text x="120" y="62" font-size="14" font-weight="700" fill="#ffffff">Skill Developer Community</text>
      <text x="120" y="102" font-size="13" font-weight="500" fill="#9fb3d9">Lead &amp; Founder</text>
    </g>

    <!-- Card 3: Rathika Elegance -->
    <g transform="translate(595, 90)">
      <rect x="0" y="0" width="240" height="135" rx="12" fill="#0d1536" fill-opacity="0.7" stroke="#9fd8ff" stroke-opacity="0.4" stroke-width="1.5"/>
      <circle cx="120" cy="70" r="6" fill="#9fd8ff" filter="url(#glow)"/>
      <text x="120" y="34" font-size="15" font-weight="700" fill="#9fd8ff">FREELANCE CONTRACT</text>
      <text x="120" y="62" font-size="14" font-weight="700" fill="#ffffff">Rathika Elegance</text>
      <text x="120" y="102" font-size="13" font-weight="500" fill="#9fb3d9">Freelance Developer</text>
    </g>

    <!-- Card 4: Open Source / Events -->
    <g transform="translate(865, 90)">
      <rect x="0" y="0" width="240" height="135" rx="12" fill="#0e1b47" fill-opacity="0.8" stroke="#eaf6ff" stroke-opacity="0.6" stroke-width="2" filter="url(#glow)"/>
      <circle cx="120" cy="70" r="6" fill="#eaf6ff" filter="url(#glow)"/>
      <text x="120" y="34" font-size="15" font-weight="700" fill="#eaf6ff">COMMUNITY WORK</text>
      <text x="120" y="62" font-size="14" font-weight="700" fill="#ffffff">PyExpo2K26 &amp; Atelier</text>
      <text x="120" y="102" font-size="13" font-weight="700" fill="#61dafb">Active Contributor</text>
    </g>

  </g>
</svg>
