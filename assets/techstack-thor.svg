<svg width="1160" height="650" viewBox="0 0 1160 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stormBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04050c"/>
      <stop offset="40%" stop-color="#0b1230"/>
      <stop offset="70%" stop-color="#131a3f"/>
      <stop offset="100%" stop-color="#05060f"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="cloudSoft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a3266" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2a3266" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1160" height="650" rx="16" fill="url(#stormBg)"/>
  <rect x="1" y="1" width="1158" height="648" rx="15" fill="none" stroke="#9fd8ff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- storm clouds -->
  <g>
    <ellipse cx="180" cy="50" rx="200" ry="76" fill="url(#cloudSoft)"/>
    <ellipse cx="620" cy="28" rx="260" ry="72" fill="url(#cloudSoft)"/>
    <ellipse cx="980" cy="60" rx="220" ry="76" fill="url(#cloudSoft)"/>
  </g>

  <!-- lightning bolts -->
  <g fill="none" stroke="#cfe9ff" stroke-width="3" stroke-linejoin="round" filter="url(#glow)">
    <path d="M150,0 L130,95 L155,110 L120,235 L148,250 L110,390 L140,405 L100,650" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0.4;0;0;0;0" keyTimes="0;0.1;0.35;0.4;0.45;0.5;0.7;0.9;1" dur="5.2s" repeatCount="indefinite"/>
    </path>
    <path d="M1010,0 L990,90 L1018,105 L985,225 L1015,242 L980,375 L1008,390 L965,650" opacity="0">
      <animate attributeName="opacity" values="0;0;0;1;0.4;0;0;0;0" keyTimes="0;0.2;0.55;0.6;0.65;0.7;0.85;0.97;1" dur="7.4s" repeatCount="indefinite" begin="2.4s"/>
    </path>
  </g>

  <!-- thunder flash effect -->
  <rect width="1160" height="650" fill="#dcefff" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.14;0.03;0;0;0;0" keyTimes="0;0.1;0.35;0.4;0.45;0.5;0.7;0.9;1" dur="5.2s" repeatCount="indefinite"/>
  </rect>

  <!-- lightning emblem -->
  <g transform="translate(1092,100)">
    <path d="M-4,-34 L-26,10 L-6,10 L-14,40 L28,-6 L6,-6 L16,-34 Z" fill="#eaf6ff" filter="url(#glow)" opacity="0.9">
      <animate attributeName="opacity" values="0.55;0.9;0.55" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Layout categories -->
  <g font-family="Arial, Helvetica, sans-serif">

    <!-- Frontend Row -->
    <text x="580" y="66" text-anchor="middle" font-size="18" font-weight="700" fill="#eaf6ff">Frontend</text>
    <g font-size="14" font-weight="700">
      <rect x="133" y="90" width="100" height="38" rx="9" fill="#DD0031"/>
      <text x="183" y="115" text-anchor="middle" fill="#ffffff" textLength="76" lengthAdjust="spacingAndGlyphs">ANGULAR</text>
      
      <rect x="245" y="90" width="90" height="38" rx="9" fill="#20232A"/>
      <text x="290" y="115" text-anchor="middle" fill="#61DAFB" textLength="56" lengthAdjust="spacingAndGlyphs">REACT</text>
      
      <rect x="347" y="90" width="90" height="38" rx="9" fill="#4FC08D"/>
      <text x="392" y="115" text-anchor="middle" fill="#ffffff" textLength="56" lengthAdjust="spacingAndGlyphs">VUE.JS</text>
      
      <rect x="449" y="90" width="120" height="38" rx="9" fill="#3178C6"/>
      <text x="509" y="115" text-anchor="middle" fill="#ffffff" textLength="96" lengthAdjust="spacingAndGlyphs">TYPESCRIPT</text>
      
      <rect x="581" y="90" width="120" height="38" rx="9" fill="#F7DF1E"/>
      <text x="641" y="115" text-anchor="middle" fill="#1a1a1a" textLength="96" lengthAdjust="spacingAndGlyphs">JAVASCRIPT</text>
      
      <rect x="713" y="90" width="130" height="38" rx="9" fill="#06B6D4"/>
      <text x="778" y="115" text-anchor="middle" fill="#ffffff" textLength="106" lengthAdjust="spacingAndGlyphs">TAILWIND CSS</text>
      
      <rect x="855" y="90" width="85" height="38" rx="9" fill="#E34F26"/>
      <text x="897.5" y="115" text-anchor="middle" fill="#ffffff" textLength="61" lengthAdjust="spacingAndGlyphs">HTML5</text>
      
      <rect x="952" y="90" width="75" height="38" rx="9" fill="#1572B6"/>
      <text x="989.5" y="115" text-anchor="middle" fill="#ffffff" textLength="51" lengthAdjust="spacingAndGlyphs">CSS3</text>
    </g>

    <!-- Backend Row -->
    <text x="580" y="184" text-anchor="middle" font-size="18" font-weight="700" fill="#eaf6ff">Backend</text>
    <g font-size="14" font-weight="700">
      <rect x="272" y="208" width="100" height="38" rx="9" fill="#339933"/>
      <text x="322" y="233" text-anchor="middle" fill="#ffffff" textLength="76" lengthAdjust="spacingAndGlyphs">NODE.JS</text>
      
      <rect x="387" y="208" width="100" height="38" rx="9" fill="#000000" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="437" y="233" text-anchor="middle" fill="#ffffff" textLength="76" lengthAdjust="spacingAndGlyphs">EXPRESS</text>
      
      <rect x="502" y="208" width="95" height="38" rx="9" fill="#E0234E"/>
      <text x="549.5" y="233" text-anchor="middle" fill="#ffffff" textLength="71" lengthAdjust="spacingAndGlyphs">NESTJS</text>
      
      <rect x="612" y="208" width="95" height="38" rx="9" fill="#3776AB"/>
      <text x="659.5" y="233" text-anchor="middle" fill="#ffffff" textLength="71" lengthAdjust="spacingAndGlyphs">PYTHON</text>
      
      <rect x="722" y="208" width="90" height="38" rx="9" fill="#000000" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="767" y="233" text-anchor="middle" fill="#ffffff" textLength="66" lengthAdjust="spacingAndGlyphs">FLASK</text>
      
      <rect x="827" y="208" width="60" height="38" rx="9" fill="#A8B9CC"/>
      <text x="857" y="233" text-anchor="middle" fill="#1a1a1a" textLength="20" lengthAdjust="spacingAndGlyphs">C</text>
    </g>

    <!-- Database Row -->
    <text x="580" y="302" text-anchor="middle" font-size="18" font-weight="700" fill="#eaf6ff">Database</text>
    <g font-size="14" font-weight="700">
      <rect x="409" y="326" width="90" height="38" rx="9" fill="#4479A1"/>
      <text x="454" y="351" text-anchor="middle" fill="#ffffff" textLength="66" lengthAdjust="spacingAndGlyphs">MYSQL</text>
      
      <rect x="515" y="326" width="110" height="38" rx="9" fill="#47A248"/>
      <text x="570" y="351" text-anchor="middle" fill="#ffffff" textLength="86" lengthAdjust="spacingAndGlyphs">MONGODB</text>
      
      <rect x="641" y="326" width="110" height="38" rx="9" fill="#3ECF8E"/>
      <text x="696" y="351" text-anchor="middle" fill="#ffffff" textLength="86" lengthAdjust="spacingAndGlyphs">SUPABASE</text>
    </g>

    <!-- AI & Creative Row -->
    <text x="530" y="420" text-anchor="middle" font-size="18" font-weight="700" fill="#eaf6ff">AI &amp; Creative Stack</text>
    <text x="705" y="420" text-anchor="middle" font-size="12" fill="#9fb3d9">· from side projects</text>
    <g font-size="14" font-weight="700">
      <rect x="185" y="444" width="160" height="38" rx="9" fill="#FF6F00"/>
      <text x="265" y="469" text-anchor="middle" fill="#ffffff" textLength="136" lengthAdjust="spacingAndGlyphs">MACHINE LEARNING</text>
      
      <rect x="359" y="444" width="150" height="38" rx="9" fill="#5C3EE8"/>
      <text x="434" y="469" text-anchor="middle" fill="#ffffff" textLength="126" lengthAdjust="spacingAndGlyphs">COMPUTER VISION</text>
      
      <rect x="523" y="444" width="100" height="38" rx="9" fill="#5C3EE8"/>
      <text x="573" y="469" text-anchor="middle" fill="#ffffff" textLength="76" lengthAdjust="spacingAndGlyphs">OPENCV</text>
      
      <rect x="637" y="444" width="130" height="38" rx="9" fill="#FF6F00"/>
      <text x="702" y="469" text-anchor="middle" fill="#ffffff" textLength="106" lengthAdjust="spacingAndGlyphs">TENSORFLOW</text>
      
      <rect x="781" y="444" width="100" height="38" rx="9" fill="#000000" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="831" y="469" text-anchor="middle" fill="#ffffff" textLength="76" lengthAdjust="spacingAndGlyphs">THREE.JS</text>
      
      <rect x="895" y="444" width="80" height="38" rx="9" fill="#88CE02"/>
      <text x="935" y="469" text-anchor="middle" fill="#1a1a1a" textLength="56" lengthAdjust="spacingAndGlyphs">GSAP</text>
    </g>

    <!-- Deployment & Tools Row -->
    <text x="580" y="538" text-anchor="middle" font-size="18" font-weight="700" fill="#eaf6ff">Deployment &amp; Tools</text>
    <g font-size="14" font-weight="700">
      <rect x="313" y="562" width="100" height="38" rx="9" fill="#000000" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="363" y="587" text-anchor="middle" fill="#ffffff" textLength="76" lengthAdjust="spacingAndGlyphs">VERCEL</text>
      
      <rect x="429" y="562" width="100" height="38" rx="9" fill="#46E3B7"/>
      <text x="479" y="587" text-anchor="middle" fill="#1a1a1a" textLength="76" lengthAdjust="spacingAndGlyphs">RENDER</text>
      
      <rect x="545" y="562" width="100" height="38" rx="9" fill="#2496ED"/>
      <text x="595" y="587" text-anchor="middle" fill="#ffffff" textLength="76" lengthAdjust="spacingAndGlyphs">DOCKER</text>
      
      <rect x="661" y="562" width="70" height="38" rx="9" fill="#F05032"/>
      <text x="696" y="587" text-anchor="middle" fill="#ffffff" textLength="41" lengthAdjust="spacingAndGlyphs">GIT</text>
      
      <rect x="747" y="562" width="100" height="38" rx="9" fill="#181717" stroke="#ffffff" stroke-opacity="0.15"/>
      <text x="797" y="587" text-anchor="middle" fill="#ffffff" textLength="76" lengthAdjust="spacingAndGlyphs">GITHUB</text>
    </g>

  </g>
</svg>
